name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project LearningWords.xcodeproj \
            -scheme LearningWords \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LearningWords.app Payload/
          zip -qry LearningWords.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LearningWords-ipa
          path: LearningWords.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" LearningWords.ipa \
            --title "Build ${{ github.run_number }}" \
            --notes "Unsigned IPA from ${{ github.sha }}. Install with Sideloadly or AltStore." \
            --target "${{ github.sha }}"
